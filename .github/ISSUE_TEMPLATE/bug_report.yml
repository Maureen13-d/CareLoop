name: Bug report
description: Something is not working as expected
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment and logs
      description: OS, Python/Node versions, branch, error messages. Do not paste real patient data or secrets.
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options: [case-engine, records-referrals, frontend, data-ai, docs-governance, platform]
