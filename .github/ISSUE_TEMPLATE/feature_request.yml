name: Feature request
description: Propose a new feature or behaviour
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that tells us when this is done.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options: [case-engine, assistant, channels, interop, frontend, data-eval, docs-governance, platform]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0-must, P1-should, P2-could]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or safety impact
      description: Does this touch patient data, consent, access control or AI output?
