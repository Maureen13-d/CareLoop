name: Technical task
description: A setup, refactor, test or other engineering task
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or approach
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers or WBS task IDs (see project-management/DEPENDENCIES.md)
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options: [case-engine, records-referrals, frontend, data-ai, docs-governance, platform]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0-must, P1-should, P2-could]
    validations:
      required: true
