name: CI

on:
  push:
    branches: [main, chore/bootstrap, feat/ksl-avatar]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q tests/test_api.py tests/test_pathway.py tests/test_interop.py tests/test_ksl_kmp.py tests/test_ksl_manifest.py tests/test_ksl_registry.py tests/test_ksl_followup.py tests/test_ksl_research_policy.py tests/test_ksl_research_motion.py tests/test_asl_sample.py tests/test_help_routing.py
      - name: Mock hospital tests
        working-directory: .
        run: python -m pytest -q integrations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test src/ksl/engine.test.js src/ksl/researchLabel.test.js src/ksl/researchPose.test.js src/ksl/aslPose.test.js src/ksl/signReplies.test.js
      - run: npm run build

  ksl-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_ksl_assets.py
      - run: pip install pytest
      - run: pytest -q scripts/test_ksl_asset_policy.py scripts/test_ksl_dataset_index.py