# PENDING CLINICAL REVIEW
# Navigation lines only. They do not name a condition or a screening type.
# Do not use the mapping keys off, on, yes, or no. YAML 1.1 reads those as booleans.

en:
  ask_language: "CareLoop\n1 English\n2 Kiswahili"
  ask_id: "Enter the ID on your card."
  ask_code: "Enter the code that was sent to you."
  id_rejected: "That ID or code was not accepted."
  status: "Your next step is to go to the clinic. Reply 1 if you have been, 2 if not yet, 5 if you feel worse."
  been: "Thank you. The clinic still needs to confirm the visit. Keep your card."
  not_yet: "We can help with what is stopping you. Reply with fear, cost, transport, stigma, or where."
  same: "Thank you for saying. Please still go to the clinic."
  better: "Thank you for saying. Please still go to the clinic so a clinician can see you."
  worse: "Please go to the nearest clinic now. A health worker will also follow up."
  fear: "A counsellor can talk with you about the fear. Please still go to the clinic."
  cost: "A worker can help with the cost of getting there. Please still go to the clinic."
  transport: "A worker can help with transport fare. Please still go to the clinic."
  stigma: "A counsellor can talk with you. Please still go to the clinic."
  where: "A worker can help you find the clinic. Please still go."
  danger: "Please go to the nearest clinic now."
  refuse_diagnosis: "I cannot say what an illness is. Please go to the clinic and ask a clinician."
  refuse_skip: "Please do not skip the clinic. A clinician needs to see you."
  unclear: "A person will follow up. If you feel worse, go to the nearest clinic."
  stop_ack: "Messages stopped. Reply START to turn them on."
  start_ack: "Messages are on again. Your next step is still to go to the clinic."
  checkin: "Clinic check. 1 been 2 not yet. 3 same 4 better 5 worse. STOP ends messages."
  slip_1: "Keep this card. It is how you continue."
  slip_2: "A person from the clinic may contact you."
  slip_3: "If you feel worse, go to the nearest clinic."
  guide_label: "I am a guide, not a doctor. I help you get to care."

sw:
